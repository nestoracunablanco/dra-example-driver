---
apiVersion: v1
kind: Namespace
metadata:
  name: vm-test

---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  namespace: vm-test
  name: testvm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/size: small
        kubevirt.io/domain: testvm
    spec:
      readinessProbe:
        tcpSocket:
          port: 22
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        successThreshold: 3
        failureThreshold: 1
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          requests:
            memory: 512M
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:44
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              system_info:
                default_user:
                  name: test
              password: test
              chpasswd:
                expire: false
